[package]
name = "monitor-hub"
# Bumped by hand when a release is cut, and it is the only source of the version
# the hub reports: `/api/me` hands it to the panel and the status page, and
# `--help` prints it. `release.yml` builds from whatever is on the ref and knows
# nothing about this number, so a release that forgets to bump it ships a binary
# naming the previous one -- which is how this sat at 1.0.0 through v1.0.1 and
# v1.0.2.
version = "1.0.7"
edition = "2021"
license = "MIT"
description = "Lightweight server monitoring hub"
repository = "https://github.com/monitor-probe/monitor"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws", "macros"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
futures-core = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["limit", "compression-gzip"] }
# Theme archives. Both are pure Rust: the release binary is built with `cross`
# and the image is FROM scratch, which rules out a C dependency or an external
# tar.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
serde_urlencoded = "0.7"
# Only the tests need a movable clock; the relay deadline spans minutes.
# dev-dependencies do not reach the shipped binary.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

# The dev profile used to sit at its defaults, and `target/` grew to 3.2G on one
# machine: full debug info plus an incremental cache, over a 235-package tree --
# tokio, axum, reqwest/rustls, and `rusqlite` with `bundled` SQLite. Every edit
# that changed a crate hash left another pile of `.rcgu.o` files and another
# incremental session behind, and cargo never reclaims the superseded ones.
# Neither knob below touches a release build; those still follow the profile
# above, which is the only one that ships.
[profile.dev]
# Keep line tables, so panics and backtraces still name a file and line, but stop
# writing a debug-info entry per variable.
debug = "line-tables-only"
# Drop the incremental cache. This is the half of `target/` that is easiest to
# forget about -- it measured 1.2G here on its own.
incremental = false

# Dependency code does not need debug info either: when something breaks, the
# frames worth reading are in our own `src/`.
[profile.dev.package."*"]
debug = false
